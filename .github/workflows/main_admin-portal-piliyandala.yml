# Deploy Python App to Azure Web App - Admin Portal

name: Build and Deploy - Admin Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Prevent parallel deploys to avoid container conflicts
# concurrency:
#   group: admin-portal-deploy
#   cancel-in-progress: false

jobs:
  build:
    name: Build Python App
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache pip dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      # Optional: Add tests here
      # - name: Run tests
      #   run: pytest

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: |
            .
            !venv/

  deploy:
    name: Deploy to Azure Web App
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_564E6D4CF7FC44DA8576A73874B67072 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_DA841BF847754B23BB01C915D296903A }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_70FBD913475D460E928EEABAD631E390 }}

      - name: Wait before deployment
        run: sleep 20

      - name: Deploy to Azure Web App (attempt 1)
        id: deploy-try1
        continue-on-error: true
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Admin-Portal-Piliyandala'
          slot-name: 'Production'

      - name: Retry deployment if first attempt fails
        if: steps.deploy-try1.outcome == 'failure'
        run: |
          echo "First deployment failed, waiting and retrying..."
          sleep 30
        shell: bash

      - name: Deploy to Azure Web App (attempt 2)
        if: steps.deploy-try1.outcome == 'failure'
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Admin-Portal-Piliyandala'
          slot-name: 'Production'
