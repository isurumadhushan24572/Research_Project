# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# This version forces a clean ZIP deployment to ensure new code replaces old files.

name: Build and deploy Python app to Azure Web App - Admin-Portal-Piliyandala

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install -r requirements.txt

      - name: Create ZIP artifact
        run: |
          zip -r app.zip . -x "venv/*"
        shell: bash

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_F4FF87664A1F48DEA06E1D0B3B825F49 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_CD320EF8624741C888D0A8895C61F81B }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_004F775CCB5D495CABC6FF4EAB05E79D }}

      - name: Deploy to Azure Web App (ZIP deploy)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Admin-Portal-Piliyandala'
          slot-name: 'Production'
          package: app.zip
          clean: true
          type: zip
