# ============================================================
# GitHub Actions Workflow: Build and Deploy Python app to Azure Web App - Teacher-Portal
# Ensures clean ZIP deployment (replaces old files completely)
# ============================================================

name: Build and deploy Python app to Azure Web App - Teacher-Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create ZIP package (exclude venv and .git)
        run: |
          zip -r app.zip . -x "venv/*" ".git/*" "__pycache__/*"
        shell: bash

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_489C3E3F021A460BA43F44B9A19DA906 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_A05031262DCF4C3C941A2DCB0EA2B848 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_F81DBE6315314DD5B853E2D95F9ECF7B }}

      - name: Deploy to Azure Web App (ZIP deploy, clean)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Teacher-Portal'
          slot-name: 'Production'
          package: app.zip
          type: zip
          clean: true
