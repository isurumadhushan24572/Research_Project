# ✅ Modern CI/CD workflow for Azure App Service (Python)
# - Uses OIDC (secure login, no publish profile)
# - Performs clean ZIP deployment (removes old files)
# - Automatically redeploys on every push to main branch

name: Build and deploy Python app to Azure Web App - Teacher-Portal

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read  # required for actions/checkout

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up Python version
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m venv venv
          source venv/bin/activate
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Create deployment ZIP
        run: |
          zip -r app.zip . -x "venv/*" ".git/*" "__pycache__/*"
        shell: bash

      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: python-app
          path: app.zip

  deploy:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      id-token: write   # for OIDC authentication
      contents: read

    steps:
      - name: Download build artifact
        uses: actions/download-artifact@v4
        with:
          name: python-app

      - name: Login to Azure using OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZUREAPPSERVICE_CLIENTID_658E2DE87EC04F748713F0DFE0F338C7 }}
          tenant-id: ${{ secrets.AZUREAPPSERVICE_TENANTID_2A1556AC8C844F5689AF1BE354B70DD2 }}
          subscription-id: ${{ secrets.AZUREAPPSERVICE_SUBSCRIPTIONID_38AF4C6E376F421D80AE98EA9A18A5CD }}

      - name: Deploy to Azure Web App (ZIP Deploy)
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'Teacher-Portal'
          slot-name: 'Production'
          package: app.zip
          clean: true
          type: zip
